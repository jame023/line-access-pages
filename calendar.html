<!doctype html>
<html lang='th'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>จัดการวันทำงาน</title>
    <script src='https://static.line-scdn.net/liff/edge/2/sdk.js'></script>
    <style>
      :root {
        --navy:#16324f;
        --blue:#1f6feb;
        --green:#16864b;
        --red:#c9362b;
        --border:#d7dee7;
      }
      * { box-sizing:border-box; }
      body {
        margin:0;
        background:#f3f6fa;
        color:#17202b;
        font-family:system-ui,'Segoe UI',sans-serif;
      }
      .page { width:min(900px,100%); margin:auto; padding:20px; }
      .header,.card {
        border:1px solid var(--border);
        border-radius:16px;
        background:#fff;
        box-shadow:0 8px 24px rgb(22 50 79 / 8%);
      }
      .header {
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:16px;
        padding:20px;
      }
      h1,h2,p { margin-top:0; }
      h1 { margin-bottom:6px; font-size:clamp(22px,5vw,30px); }
      h2 { margin-bottom:10px; font-size:20px; }
      .muted { margin-bottom:0; color:#627083; }
      .card { display:none; margin-top:16px; padding:20px; }
      .card.show { display:block; }
      .status { margin-top:16px; border-radius:10px; padding:12px; }
      .info { background:#e9f2ff; color:#144f98; }
      .success { background:#e5f6ed; color:var(--green); }
      .error { background:#fdecea; color:var(--red); }
      .back-button {
        display:inline-flex;
        min-height:46px;
        align-items:center;
        justify-content:center;
        border-radius:10px;
        padding:10px 14px;
        background:#e8eef6;
        color:var(--navy);
        font-weight:700;
        text-decoration:none;
      }
      .backend-frame {
        position:fixed;
        left:-10px;
        bottom:-10px;
        width:1px;
        height:1px;
        border:0;
        opacity:.01;
        pointer-events:none;
      }
      @media(max-width:650px) {
        .page { padding:12px; }
        .header,.card { padding:16px; border-radius:12px; }
        .header { flex-direction:column; align-items:stretch; }
        .back-button { width:100%; }
      }
    </style>
  </head>
  <body>
    <main class='page'>
      <section class='header'>
        <div>
          <h1>จัดการวันทำงาน</h1>
          <p class='muted' id='signedInName'>กำลังตรวจสอบสิทธิ์ผ่าน LINE…</p>
        </div>
        <a class='back-button' href='index.html'>กลับหน้าจัดการผู้ใช้</a>
      </section>

      <div class='status info' id='statusBox'>กำลังเชื่อมต่อ LINE…</div>

      <section class='card' id='calendarCard'>
        <h2>ปฏิทินวันทำงาน</h2>
        <p class='muted'>ขั้นต่อไปจะเพิ่มการเลือก เต็มวัน ครึ่งวัน และวันหยุดในส่วนนี้</p>
      </section>
    </main>

    <iframe class='backend-frame' id='backendFrame' title='Apps Script backend'></iframe>

    <script>
      const LIFF_ID = '2010715544-GvrOwi60';
      const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyESq3ElbNxq7bEyZDxIIWCB4xXOljDErmlL_7c5X8zu0nMCGEnjHRh0IuNytsaBwrUbg/exec';
      const MESSAGE_SOURCE = 'line-access-frontend';
      const BRIDGE_SOURCE = 'line-access-bridge';
      const pending = new Map();
      let idToken = '';
      let bridgeWindow = null;
      let requestNumber = 0;
      let resolveBridge;
      const bridgeReady = new Promise(resolve => { resolveBridge = resolve; });

      const statusBox = document.getElementById('statusBox');
      const signedInName = document.getElementById('signedInName');
      const calendarCard = document.getElementById('calendarCard');
      const backendFrame = document.getElementById('backendFrame');

      window.addEventListener('message', receiveBridgeMessage);
      window.addEventListener('load', initialize);

      async function initialize() {
        try {
          backendFrame.src = BACKEND_URL;
          await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
          if (!liff.isLoggedIn()) throw new Error('กรุณาเข้าสู่ระบบ LINE แล้วเปิดใหม่');
          idToken = liff.getIDToken();
          if (!idToken) throw new Error('LINE ไม่ได้ส่ง ID token');

          const profile = await liff.getProfile();
          signedInName.textContent = 'เข้าสู่ระบบ: ' + profile.displayName;

          await waitForBridge();
          await callBackend('getAccessUsers');
          calendarCard.classList.add('show');
          showStatus('ยืนยันสิทธิ์ผู้บริหารแล้ว', 'success');
        } catch (error) {
          showStatus(messageOf(error), 'error');
        }
      }

      function receiveBridgeMessage(event) {
        const data = event.data;
        if (!data || data.source !== BRIDGE_SOURCE) return;

        if (data.type === 'ready') {
          bridgeWindow = event.source;
          resolveBridge();
          return;
        }

        if (data.type !== 'response' || event.source !== bridgeWindow) return;
        const request = pending.get(data.id);
        if (!request) return;

        clearTimeout(request.timer);
        pending.delete(data.id);
        data.ok ? request.resolve(data.result) : request.reject(new Error(data.error));
      }

      function waitForBridge() {
        return Promise.race([
          bridgeReady,
          new Promise((resolve, reject) => {
            setTimeout(() => reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ')), 15000);
          })
        ]);
      }

      function callBackend(action, payload) {
        return new Promise((resolve, reject) => {
          const id = 'request-' + (++requestNumber);
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('Apps Script ตอบกลับช้าเกินกำหนด'));
          }, 20000);

          pending.set(id, { resolve:resolve, reject:reject, timer:timer });
          bridgeWindow.postMessage({
            source:MESSAGE_SOURCE,
            id:id,
            action:action,
            idToken:idToken,
            payload:payload || null
          }, '*');
        });
      }

      function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = 'status ' + type;
      }

      function messageOf(error) {
        return error && error.message ? error.message : String(error);
      }
    </script>
  </body>
</html>
