<!doctype html>
<html lang='th'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>ลงทะเบียนพนักงาน</title>
    <script src='https://static.line-scdn.net/liff/edge/2/sdk.js'></script>
    <style>
      :root { --navy:#16324f; --blue:#1f6feb; --green:#16864b; --red:#c9362b; --border:#d7dee7; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:#f3f6fa; color:#17202b; font-family:system-ui,'Segoe UI',sans-serif; }
      .page { width:min(600px,100%); margin:auto; padding:20px; }
      .card { border:1px solid var(--border); border-radius:16px; padding:24px; background:#fff; box-shadow:0 8px 24px rgb(22 50 79 / 8%); }
      h1 { margin:0 0 8px; color:var(--navy); font-size:clamp(24px,7vw,32px); }
      p { margin:0 0 20px; color:#627083; line-height:1.6; }
      label { display:block; margin-top:16px; color:var(--navy); font-weight:700; }
      input,button { width:100%; min-height:50px; margin-top:8px; border:1px solid var(--border); border-radius:10px; padding:11px 13px; font:inherit; }
      input:focus { border-color:var(--blue); outline:3px solid rgb(31 111 235 / 13%); }
      button { margin-top:22px; cursor:pointer; border-color:transparent; background:var(--blue); color:#fff; font-weight:750; }
      button:disabled { cursor:wait; opacity:.55; }
      .line-name { margin:16px 0 0; border-radius:10px; padding:12px; background:#f3f6fa; color:var(--navy); }
      .status { margin-top:16px; border-radius:10px; padding:12px; }
      .info { background:#e9f2ff; color:#144f98; } .success { background:#e5f6ed; color:var(--green); } .error { background:#fdecea; color:var(--red); }
      .backend-frame { position:fixed; left:-10px; bottom:-10px; width:1px; height:1px; border:0; opacity:.01; pointer-events:none; }
      #formArea { display:none; }
      @media(max-width:600px) { .page{padding:12px}.card{padding:18px;border-radius:12px} }
    </style>
  </head>
  <body>
    <main class='page'>
      <section class='card'>
        <h1>ลงทะเบียนพนักงาน</h1>
        <p>กรอกชื่อและรหัสพนักงาน ระบบจะรับ LINE User ID จากบัญชีที่เปิดหน้านี้โดยอัตโนมัติ</p>
        <div class='status info' id='statusBox'>กำลังเชื่อมต่อ LINE…</div>
        <div id='formArea'>
          <div class='line-name' id='lineName'></div>
          <form id='registerForm'>
            <label>ชื่อพนักงาน<input id='employeeName' maxlength='100' required autocomplete='name'></label>
            <label>รหัสพนักงาน<input id='employeeCode' maxlength='8' required placeholder='EMP-0001' pattern='EMP-[0-9]{4}'></label>
            <button id='submitButton' type='submit'>ส่งคำขอลงทะเบียน</button>
          </form>
        </div>
      </section>
    </main>
    <iframe class='backend-frame' id='backendFrame' title='Apps Script backend'></iframe>
    <script>
      const LIFF_ID = '2010715544-GvrOwi60';
      const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyESq3ElbNxq7bEyZDxIIWCB4xXOljDErmlL_7c5X8zu0nMCGEnjHRh0IuNytsaBwrUbg/exec';
      const MESSAGE_SOURCE = 'line-access-frontend';
      const BRIDGE_SOURCE = 'line-access-bridge';
      let bridgeWindow = null;
      let idToken = '';
      let resolveBridge;
      let requestNumber = 0;
      const pending = new Map();
      const bridgeReady = new Promise(resolve => { resolveBridge = resolve; });
      const el = {
        backendFrame: document.getElementById('backendFrame'),
        statusBox: document.getElementById('statusBox'),
        formArea: document.getElementById('formArea'),
        lineName: document.getElementById('lineName'),
        form: document.getElementById('registerForm'),
        employeeName: document.getElementById('employeeName'),
        employeeCode: document.getElementById('employeeCode'),
        submitButton: document.getElementById('submitButton')
      };

      window.addEventListener('message', receiveBridgeMessage);
      window.addEventListener('load', initialize);
      el.form.addEventListener('submit', submitRegistration);
      el.employeeCode.addEventListener('input', () => {
        el.employeeCode.value = el.employeeCode.value.toUpperCase();
      });

      async function initialize() {
        try {
          el.backendFrame.src = BACKEND_URL;
          await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
          if (!liff.isLoggedIn()) throw new Error('กรุณาเข้าสู่ระบบ LINE แล้วเปิดใหม่');
          idToken = liff.getIDToken();
          if (!idToken) throw new Error('LINE ไม่ได้ส่ง ID token');
          const profile = await liff.getProfile();
          el.lineName.textContent = 'บัญชี LINE: ' + profile.displayName;
          await waitForBridge();
          el.formArea.style.display = 'block';
          showStatus('พร้อมลงทะเบียน', 'info');
        } catch (error) {
          showStatus(messageOf(error), 'error');
        }
      }

      function receiveBridgeMessage(event) {
        const data = event.data;
        if (!data || data.source !== BRIDGE_SOURCE) return;
        if (data.type === 'ready') {
          bridgeWindow = event.source;
          resolveBridge();
          return;
        }
        if (data.type !== 'response' || event.source !== bridgeWindow) return;
        const request = pending.get(data.id);
        if (!request) return;
        clearTimeout(request.timer);
        pending.delete(data.id);
        data.ok ? request.resolve(data.result) : request.reject(new Error(data.error));
      }

      function waitForBridge() {
        return Promise.race([bridgeReady, new Promise((resolve, reject) => {
          setTimeout(() => reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ')), 15000);
        })]);
      }

      function callBackend(action, payload) {
        return new Promise((resolve, reject) => {
          const id = 'register-' + (++requestNumber);
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('Apps Script ตอบกลับช้าเกินกำหนด'));
          }, 20000);
          pending.set(id, { resolve: resolve, reject: reject, timer: timer });
          bridgeWindow.postMessage({
            source: MESSAGE_SOURCE,
            id: id,
            action: action,
            idToken: idToken,
            payload: payload
          }, '*');
        });
      }

      async function submitRegistration(event) {
        event.preventDefault();
        el.submitButton.disabled = true;
        showStatus('กำลังส่งคำขอลงทะเบียน…', 'info');
        try {
          const result = await callBackend('registerMyAccess', {
            employeeName: el.employeeName.value,
            employeeCode: el.employeeCode.value
          });
          if (result.active) {
            showStatus('บัญชีนี้เปิดใช้งานแล้ว ไม่ต้องลงทะเบียนซ้ำ', 'success');
          } else {
            showStatus('ส่งคำขอแล้ว กรุณารอผู้บริหารอนุมัติ', 'success');
            el.form.reset();
          }
        } catch (error) {
          showStatus(messageOf(error), 'error');
        } finally {
          el.submitButton.disabled = false;
        }
      }

      function showStatus(message, type) {
        el.statusBox.textContent = message;
        el.statusBox.className = 'status ' + type;
      }

      function messageOf(error) {
        return error && error.message ? error.message : String(error);
      }
    </script>
  </body>
</html>
